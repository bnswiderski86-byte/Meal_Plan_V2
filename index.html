<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Month Long Dinner Meal Plan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b333a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meal Plan">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef0f0;
    --paper: #fbfbfa;
    --ink: #2b333a;
    --muted: #6b7178;
    --accent: #3d7c78;
    --accent2: #4a6fa5;
    --accent3: #8c8368;
    --border: #d8d9d4;
    --tag-american: #e3f0ee;
    --tag-american-text: #2f6b66;
    --tag-mexican: #ece8dc;
    --tag-mexican-text: #7a6f4e;
    --tag-italian: #e7edf5;
    --tag-italian-text: #3a5a85;
    --tag-seafood: #e3eef2;
    --tag-seafood-text: #2b6e86;
    --tag-gout: #eceef0;
    --tag-gout-text: #4a555e;
  }
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    font-family: 'Karla', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 0 0 60px;
  }
 
  header {
    background: var(--ink);
    color: var(--bg);
    padding: 48px 32px 40px;
    position: relative;
    overflow: hidden;
  }
 
  header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: rgba(61,124,120,0.14);
  }
 
  header::after {
    content: '';
    position: absolute;
    bottom: -40px; left: 10%;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(74,111,165,0.10);
  }
 
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
    text-align: center;
  }
 
  .header-tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent3);
    margin-bottom: 10px;
  }
 
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    font-weight: 900;
    line-height: 1.05;
    margin-bottom: 14px;
  }
 
  header p {
    font-size: 15px;
    font-weight: 300;
    color: rgba(238,240,240,0.7);
    max-width: 540px;
    line-height: 1.6;
  }
 
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 22px;
    align-items: center;
  }
 
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(238,240,240,0.75);
  }
 
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
 
  .dot-american { background: var(--accent); }
  .dot-mexican  { background: var(--accent3); }
  .dot-italian  { background: var(--accent2); }
  .dot-seafood  { background: #1a6a9a; }
 
  .gout-note {
    margin-top: 18px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 300;
    color: rgba(238,240,240,0.6);
    max-width: 580px;
    line-height: 1.65;
  }
 
  .gout-note strong { color: rgba(238,240,240,0.9); font-weight: 600; }
 
  .view-tabs {
    max-width: 960px;
    margin: 28px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 8px;
  }
 
  .view-tab {
    flex: 1;
    padding: 12px 18px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--paper);
    font-family: 'Karla', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    text-align: center;
    transition: all 0.18s;
  }
 
  .view-tab.active {
    background: var(--ink);
    color: #ffffff;
    border-color: var(--ink);
  }
 
  .controls {
    max-width: 960px;
    margin: 16px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
 
  .filter-btn {
    padding: 7px 18px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--paper);
    font-family: 'Karla', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    color: var(--ink);
  }
 
  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
 
  .filter-btn[onclick*="'american'"] { background: var(--tag-american); color: var(--tag-american-text); border-color: var(--tag-american); }
  .filter-btn[onclick*="'american'"].active { background: var(--tag-american-text); color: #ffffff; border-color: var(--tag-american-text); }
 
  .filter-btn[onclick*="'mexican'"] { background: var(--tag-mexican); color: var(--tag-mexican-text); border-color: var(--tag-mexican); }
  .filter-btn[onclick*="'mexican'"].active { background: var(--tag-mexican-text); color: #ffffff; border-color: var(--tag-mexican-text); }
 
  .filter-btn[onclick*="'italian'"] { background: var(--tag-italian); color: var(--tag-italian-text); border-color: var(--tag-italian); }
  .filter-btn[onclick*="'italian'"].active { background: var(--tag-italian-text); color: #ffffff; border-color: var(--tag-italian-text); }
 
  .filter-btn[onclick*="'seafood'"] { background: var(--tag-seafood); color: var(--tag-seafood-text); border-color: var(--tag-seafood); }
  .filter-btn[onclick*="'seafood'"].active { background: var(--tag-seafood-text); color: #ffffff; border-color: var(--tag-seafood-text); }
 
  .weeks {
    max-width: 960px;
    margin: 32px auto 0;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
 
  .week-block {
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
 
  .grocery-view {
    max-width: 960px;
    margin: 20px auto 60px;
    padding: 0 24px;
  }
 
  .grocery-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
 
  .grocery-intro {
    font-size: 14px;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.6;
    max-width: 620px;
  }
 
  .grocery-topbar-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
 
  .email-btn {
    font-family: 'Karla', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent2);
    background: var(--tag-italian);
    border: 1px solid var(--accent2);
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
  }
 
  .email-btn:hover { opacity: 0.85; }
 
  .grocery-week-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
 
  .email-btn-small {
    font-family: 'Karla', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: #ffffff;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.32);
    padding: 5px 11px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
 
  .email-btn-small:hover { background: rgba(255,255,255,0.26); }
 
  .grocery-week {
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 24px;
    scroll-margin-top: 90px;
  }
 
  .grocery-week-header {
    background: var(--ink);
    color: #ffffff;
    padding: 16px 22px;
  }
 
  .grocery-week-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
 
  .grocery-week-meals {
    font-size: 13px;
    font-weight: 300;
    opacity: 0.8;
    line-height: 1.5;
  }
 
  .grocery-week-body {
    padding: 18px 22px 6px;
  }
 
  .grocery-category {
    margin-bottom: 18px;
  }
 
  .grocery-category h4 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }
 
  .grocery-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    line-height: 1.4;
    cursor: pointer;
  }
 
  .grocery-item:last-child { border-bottom: none; }
 
  .grocery-item input[type="checkbox"] {
    margin-top: 3px;
    accent-color: var(--accent);
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    cursor: pointer;
  }
 
  .grocery-item.checked .grocery-item-text { opacity: 0.4; text-decoration: line-through; }
 
  .grocery-item-text { flex: 1; }
 
  .grocery-item-source {
    color: var(--muted);
    font-style: italic;
    font-size: 12.5px;
  }
 
  .grocery-takeout-note {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    padding: 8px 0 16px;
  }
 
  .week-header {
    background: var(--ink);
    color: var(--bg);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
 
  .week-num {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 900;
    opacity: 0.2;
    line-height: 1;
    color: #ffffff;
  }
 
  .week-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #ffffff;
  }
 
  .week-sub {
    font-size: 13px;
    font-weight: 300;
    opacity: 0.55;
    color: #ffffff;
  }
 
  .week-grocery-btn {
    margin-left: auto;
    font-family: 'Karla', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: #ffffff;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.32);
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.18s;
  }
 
  .week-grocery-btn:hover { background: rgba(255,255,255,0.26); }
 
  .shuffle-btn {
    font-family: 'Karla', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--tag-italian);
    border: 1px solid var(--accent);
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
  }
 
  .shuffle-btn:hover { opacity: 0.85; }
 
  .days-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
 
  .day-card {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    transition: background 0.15s;
    display: flex;
    flex-direction: column;
  }
 
  .day-card:hover { background: #fdf0e4; }
  .day-card.hidden { display: none; }
 
  .day-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }
 
  .day-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 10px;
  }
 
  .meal-name {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
    margin-bottom: 7px;
  }
 
  .meal-desc {
    font-size: 12px;
    font-weight: 300;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 10px;
    flex: 1;
  }
 
  .gout-tip {
    font-size: 11px;
    font-weight: 400;
    color: var(--tag-gout-text);
    background: var(--tag-gout);
    border-radius: 6px;
    padding: 5px 8px;
    margin-bottom: 8px;
    line-height: 1.45;
  }
 
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: auto;
  }
 
  .cuisine-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 20px;
  }
 
  .tag-american { background: var(--tag-american); color: var(--tag-american-text); }
  .tag-mexican  { background: var(--tag-mexican);  color: var(--tag-mexican-text);  }
  .tag-italian  { background: var(--tag-italian);  color: var(--tag-italian-text);  }
  .tag-seafood  { background: var(--tag-seafood);  color: var(--tag-seafood-text);  }
 
  /* ── Breakfast & Lunch view ─────────────────────────────────────────── */
  .bflunch-topbar {
    max-width: 960px;
    margin: 20px auto 0;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
 
  .bflunch-intro {
    font-size: 14px;
    font-weight: 300;
    color: var(--muted);
    line-height: 1.6;
    max-width: 620px;
  }
 
  .bflunch-wrap {
    max-width: 960px;
    margin: 20px auto 60px;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }
 
  .prep-card {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    transition: background 0.15s;
    display: flex;
    flex-direction: column;
  }
 
  .prep-card:hover { background: #fdf0e4; }
 
  .prep-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--tag-american);
    border-radius: 20px;
    padding: 3px 9px;
    margin-bottom: 9px;
    align-self: flex-start;
  }
 
  .prep-note {
    font-size: 11px;
    font-weight: 400;
    color: var(--accent2);
    background: var(--tag-italian);
    border-radius: 6px;
    padding: 5px 8px;
    margin-bottom: 8px;
    line-height: 1.45;
  }
 
  .recipe-prep-ahead {
    font-size: 11.5px;
    font-weight: 400;
    color: var(--accent2);
    background: var(--tag-italian);
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 14px;
    line-height: 1.55;
  }
 
  .recipe-prep-ahead strong { color: var(--ink); }
 
  .grocery-add-btn {
    font-family: 'Karla', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: var(--paper);
    border: 1.5px solid var(--accent);
    padding: 7px 12px;
    border-radius: 20px;
    cursor: pointer;
    flex: 1;
    white-space: nowrap;
  }
 
  .grocery-add-btn:hover { background: var(--tag-american); }
 
  .grocery-add-btn.added {
    background: var(--accent);
    color: #ffffff;
  }
 
  .guide-wrap {
    max-width: 960px;
    margin: 32px auto 0;
    padding: 0 24px;
  }
 
  .guide-inner {
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 26px 28px;
  }
 
  .guide-inner h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    margin-bottom: 18px;
  }
 
  .guide-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
 
  .guide-col h4 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
 
  .guide-col.good h4  { color: var(--accent2); }
  .guide-col.limit h4 { color: var(--accent3); }
 
  .guide-col ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
 
  .guide-col ul li {
    font-size: 13px;
    font-weight: 300;
    color: var(--muted);
    padding-left: 14px;
    position: relative;
    line-height: 1.45;
  }
 
  .guide-col ul li::before {
    content: '·';
    position: absolute;
    left: 0;
    font-weight: 900;
  }
 
  .guide-col.good ul li::before  { color: var(--accent2); }
  .guide-col.limit ul li::before { color: var(--accent3); }
 
  footer {
    max-width: 960px;
    margin: 36px auto 0;
    padding: 0 24px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.7;
  }
 
  @media (max-width: 540px) {
    header { padding: 36px 18px 32px; }
    .controls, .weeks, .guide-wrap { padding: 0 14px; }
    .days-grid { grid-template-columns: 1fr 1fr; }
    .guide-cols { grid-template-columns: 1fr; }
  }
 
  /* Checked / done state */
  .day-card.done {
    background: #f0f7f0;
    opacity: 0.75;
  }
 
  .day-card.done .meal-name {
    text-decoration: line-through;
    color: var(--muted);
  }
 
  .day-card.done .day-num {
    opacity: 0.4;
  }
 
  .check-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px 5px 8px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    font-family: 'Karla', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.18s;
  }
 
  .check-btn:hover {
    border-color: var(--accent2);
    color: var(--accent2);
    background: #f0f7f0;
  }
 
  .check-icon {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    background: white;
    flex-shrink: 0;
  }
 
  .day-card.done .check-btn {
    border-color: var(--accent2);
    color: var(--accent2);
    background: #e4f0e4;
  }
 
  .day-card.done .check-btn .check-icon {
    background: var(--accent2);
    border-color: var(--accent2);
    color: white;
  }
 
  /* Progress bar */
  .progress-wrap {
    max-width: 960px;
    margin: 20px auto 0;
    padding: 0 24px;
  }
 
  .progress-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }
 
  .progress-label strong { color: var(--accent2); font-size: 13px; }
 
  .progress-bar-outer {
    background: var(--border);
    border-radius: 20px;
    height: 8px;
    overflow: hidden;
  }
 
  .progress-bar-inner {
    height: 100%;
    background: var(--accent2);
    border-radius: 20px;
    transition: width 0.4s ease;
    width: 0%;
  }
 
  .reset-btn {
    font-family: 'Karla', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: color 0.15s;
  }
 
  .reset-btn:hover { color: var(--accent); }
 
  /* Swap button & menu */
  .card-actions {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
 
  .swap-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    font-family: 'Karla', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.18s;
  }
 
  .swap-btn:hover {
    border-color: var(--accent3);
    color: var(--accent3);
    background: #fff8e6;
  }
 
  .day-card.swapped {
    border-right-color: var(--accent3);
    border-bottom-color: var(--accent3);
  }
 
  .tag-swap {
    background: #fff8e6;
    color: var(--accent3);
  }
 
  /* Swap menu overlay */
  .swap-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
 
  .swap-overlay.open {
    display: flex;
  }
 
  .swap-menu {
    background: var(--paper);

// Checkmark storage

// Swap storage

// ── Monthly auto-shuffle ─────────────────────────────────────────────────
// Randomly assigns 31 unique meals (drawn from all 31 main-menu meals + all
// 12 swap-pool meals = 43 total) to the 31 days, guaranteeing no repeats.
// Runs automatically once per calendar month — no manual action needed.
function generateShuffle() {
  const pool = [];
  meals.forEach((m, i) => pool.push({ source: 'menu', index: i }));
  swapPool.forEach((m, i) => pool.push({ source: 'pool', index: i }));
 
  // Fisher-Yates shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
 
  const chosen = pool.slice(0, 31);
  const assignment = {};
  chosen.forEach((opt, idx) => {
    assignment[idx + 1] = { source: opt.source, index: opt.index };
  });
  return assignment;
}
 
function getShuffleState() {
  try { return JSON.parse(localStorage.getItem(SHUFFLE_KEY)) || null; }
  catch { return null; }
}
 
function saveShuffleState(state) {
  try { localStorage.setItem(SHUFFLE_KEY, JSON.stringify(state)); } catch {}
}
 
// Generate a shuffle for the current month if one doesn't already exist locally
function ensureShuffleForMonth() {
  let state = getShuffleState();
  if (!state || state.month !== currentMonth) {
    state = { month: currentMonth, assignment: generateShuffle() };
    saveShuffleState(state);
  }
  return state;
}
 
// Get the base (pre-manual-swap) meal for a day from the current shuffle
function getShuffledMeal(day) {
  const state = getShuffleState();
  if (state && state.month === currentMonth && state.assignment[day]) {
    const a = state.assignment[day];
    const base = a.source === 'menu' ? meals[a.index] : swapPool[a.index];
    if (base) return { ...base, day, _swapped: false };
  }
  return null;
}
 
// Get the meal currently shown for a given day.
// Priority: manual per-day swap (via the Swap button) > this month's
// auto-shuffle assignment > static fallback (only if shuffle is missing).
// Swap storage format: { source: 'pool'|'menu', index: N }
// Legacy format (just a number) is treated as 'pool' for backward compat
function getMealForDay(day) {
  const swaps = getSwaps();
  const swap = swaps[day];
  if (swap !== undefined) {
    // Legacy format: bare number means swapPool index
    if (typeof swap === 'number') {
      return { ...swapPool[swap], day, _swapped: true };
    }
    // New format: { source, index }
    if (swap.source === 'menu') {
      const menuMeal = meals[swap.index];
      return { ...menuMeal, day, _swapped: true };
    }
    return { ...swapPool[swap.index], day, _swapped: true };
  }
  const shuffled = getShuffledMeal(day);
  if (shuffled) return shuffled;
  const original = meals.find(m => m.day === day);
  return { ...original, _swapped: false };
}
 
 
// Check if a meal matches the current filter
function matchesFilter(meal, filter) {
  if (filter === 'all') return true;
  if (filter === 'seafood') return meal.seafood;
  return meal.cuisine === filter;
}
 
// Build a single card's HTML content (used by both initial render and rebuild)
function buildCardHTML(meal, day) {
  const checked = getChecked();
  const isChecked = checked.includes(day);
 
  let tagsHTML = '';
  if (meal.seafood) tagsHTML += `<span class="cuisine-tag tag-seafood">Seafood</span>`;
  tagsHTML += `<span class="cuisine-tag tag-${meal.cuisine}">${meal.cuisine.charAt(0).toUpperCase()+meal.cuisine.slice(1)}</span>`;
  if (meal._swapped) tagsHTML += `<span class="cuisine-tag tag-swap">Swapped</span>`;
 
  const goutHTML = meal.gout ? `<div class="gout-tip">💧 ${meal.gout}</div>` : '';
 
  return `
    <div class="day-label">${getDayName(day)} · Day ${day}</div>
    <div class="day-num">${day}</div>
    <div class="meal-name" onclick="openRecipe('${meal.name.replace(/'/g, "\\'")}')">${meal.name}</div>
    <div class="meal-desc">${meal.desc}</div>
    ${goutHTML}
    <div class="tags">${tagsHTML}</div>
    <div class="card-actions">
      <button class="check-btn" onclick="toggleDay(${day})">
        <span class="check-icon">${isChecked ? '✓' : ''}</span>
        <span class="check-label">${isChecked ? 'Done!' : 'Mark as made'}</span>
      </button>
      <button class="swap-btn" onclick="openSwapMenu(${day})">⇄ Swap</button>
    </div>
  `;
}
 
// Apply correct CSS classes to a card based on its state
function applyCardState(card, meal, day) {
  const isChecked = getChecked().includes(day);
  card.className = 'day-card' +
    (isChecked ? ' done' : '') +
    (meal._swapped ? ' swapped' : '') +
    (matchesFilter(meal, currentFilter) ? '' : ' hidden');
}
 
// Build the entire weeks grid
function buildUI(filter) {
  currentFilter = filter;
  const container = document.getElementById('weeksContainer');
  container.innerHTML = '';
 
  const weeks = [[], [], [], [], []];
  meals.forEach(m => {
    const wi = m.day <= 7 ? 0 : m.day <= 14 ? 1 : m.day <= 21 ? 2 : m.day <= 28 ? 3 : 4;
    weeks[wi].push(m);
  });
 
  weeks.forEach((week, wi) => {
    // Count visible meals using the actual displayed meal (which may be swapped)
    const visibleCount = week.filter(m => matchesFilter(getMealForDay(m.day), filter)).length;
 
    if (visibleCount === 0) return;
 
    const block = document.createElement('div');
    block.className = 'week-block';
    block.innerHTML = `
      <div class="week-header">
        <div class="week-num">0${wi+1}</div>
        <div>
          <div class="week-title">${weekLabels[wi]}</div>
        </div>
        <button class="week-grocery-btn" onclick="location.hash='groceries-week-${wi+1}'">🛒 Grocery List</button>
      </div>
    `;
 
    const grid = document.createElement('div');
    grid.className = 'days-grid';
 
    week.forEach(originalMeal => {
      const meal = getMealForDay(originalMeal.day);
      const card = document.createElement('div');
      card.dataset.day = originalMeal.day;
      applyCardState(card, meal, originalMeal.day);
      card.innerHTML = buildCardHTML(meal, originalMeal.day);
      grid.appendChild(card);
    });
 
    block.appendChild(grid);
    container.appendChild(block);
  });
}
 
// Rebuild a single card in place (after swap or restore)
function rebuildCard(day) {
  const card = document.querySelector(`.day-card[data-day="${day}"]`);
  if (!card) return;
  const meal = getMealForDay(day);
  applyCardState(card, meal, day);
  card.innerHTML = buildCardHTML(meal, day);
 
  // Recalculate week count in case filter visibility changed
  refreshWeekCounts();
  refreshGroceryIfVisible();
}
 
// Re-render the grocery list if it's the currently visible view, so it
// always reflects the latest swaps/shuffle without the person having to ask
function refreshGroceryIfVisible() {
  const groceryView = document.getElementById('groceryView');
  if (groceryView && groceryView.style.display !== 'none') {
    renderGroceryList();
  }
}
 
// Update the "X dinners" subtitle on each week header to reflect filter + swaps
function refreshWeekCounts() {
  const blocks = document.querySelectorAll('.week-block');
  const weeks = [[], [], [], [], []];
  meals.forEach(m => {
    const wi = m.day <= 7 ? 0 : m.day <= 14 ? 1 : m.day <= 21 ? 2 : m.day <= 28 ? 3 : 4;
    weeks[wi].push(m);
  });
 
  let blockIndex = 0;
  weeks.forEach((week) => {
    const visibleCount = week.filter(m => matchesFilter(getMealForDay(m.day), currentFilter)).length;
    if (visibleCount === 0) return;
    const block = blocks[blockIndex];
    if (block) {
      const sub = block.querySelector('.week-sub');
      if (sub) sub.textContent = `${visibleCount} dinner${visibleCount !== 1 ? 's' : ''}`;
    }
    blockIndex++;
  });
}

// Checkmark toggling
function toggleDay(day) {
  let checked = getChecked();
  checked = checked.includes(day)
    ? checked.filter(d => d !== day)
    : [...checked, day];
  saveChecked(checked);
 
  const card = document.querySelector(`.day-card[data-day="${day}"]`);
  if (card) {
    const meal = getMealForDay(day);
    applyCardState(card, meal, day);
    const icon = card.querySelector('.check-icon');
    const label = card.querySelector('.check-label');
    const isDone = checked.includes(day);
    if (icon) icon.textContent = isDone ? '✓' : '';
    if (label) label.textContent = isDone ? 'Done!' : 'Mark as made';
  }
  updateProgress();
}
 
function updateProgress() {
  const count = getChecked().length;
  document.getElementById('progressText').textContent = `${count} of 31`;
  document.getElementById('progressBar').style.width = (count / 31 * 100) + '%';
}
 
function resetAll() {
  if (!confirm('Clear all checkmarks and start fresh?')) return;
  saveChecked([]);
  document.querySelectorAll('.day-card.done').forEach(card => {
    const day = parseInt(card.dataset.day, 10);
    const meal = getMealForDay(day);
    applyCardState(card, meal, day);
    const icon = card.querySelector('.check-icon');
    const label = card.querySelector('.check-label');
    if (icon) icon.textContent = '';
    if (label) label.textContent = 'Mark as made';
  });
  updateProgress();
}
 
// Swap menu
let activeSwapDay = null;
 
function openSwapMenu(day) {
  activeSwapDay = day;
  const menu = document.getElementById('swapMenu');
  const list = document.getElementById('swapList');
  list.innerHTML = '';
 
  const swaps = getSwaps();
  if (swaps[day] !== undefined) {
    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'swap-option restore-option';
    restoreBtn.innerHTML = `<span class="swap-option-name">↩ Undo Swap</span>`;
    restoreBtn.onclick = () => { restoreOriginal(day); closeSwapMenu(); };
    list.appendChild(restoreBtn);
  }
 
  // Build unified option list: all 43 meals (main menu + swap pool),
  // minus whatever meal is currently showing for this day
  const currentMeal = getMealForDay(day);
  const allOptions = [];
  meals.forEach((meal, i) => {
    if (meal.name !== currentMeal.name) {
      allOptions.push({ meal, source: 'menu', index: i });
    }
  });
  swapPool.forEach((meal, i) => {
    if (meal.name !== currentMeal.name) {
      allOptions.push({ meal, source: 'pool', index: i });
    }
  });
 
  // Group by cuisine
  const groups = {
    american: { label: 'American', items: [] },
    mexican: { label: 'Mexican', items: [] },
    italian: { label: 'Italian', items: [] },
  };
  allOptions.forEach(opt => {
    const cuisine = opt.meal.cuisine;
    if (groups[cuisine]) groups[cuisine].items.push(opt);
  });
 
  // Sort each group alphabetically and dedupe by name (so a meal doesn't
  // show up twice if it's in both meals[] and swapPool)
  Object.values(groups).forEach(g => {
    const seen = new Set();
    g.items = g.items
      .filter(opt => {
        if (seen.has(opt.meal.name)) return false;
        seen.add(opt.meal.name);
        return true;
      })
      .sort((a, b) => a.meal.name.localeCompare(b.meal.name));
  });
 
  // Render each cuisine group
  ['american', 'mexican', 'italian'].forEach(cuisine => {
    const group = groups[cuisine];
    if (group.items.length === 0) return;
 
    const heading = document.createElement('div');
    heading.className = 'swap-group-heading';
    heading.innerHTML = `<span>${group.label}</span><span class="swap-group-count">${group.items.length}</span>`;
    list.appendChild(heading);
 
    group.items.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'swap-option';
      const tagColor = `tag-${opt.meal.cuisine}`;
      const seafoodTag = opt.meal.seafood
        ? `<span class="cuisine-tag tag-seafood">Seafood</span>`
        : '';
      btn.innerHTML = `
        <span class="swap-option-name">${opt.meal.name}</span>
        <span class="swap-option-tags">
          ${seafoodTag}
          <span class="cuisine-tag ${tagColor}">${opt.meal.cuisine.charAt(0).toUpperCase()+opt.meal.cuisine.slice(1)}</span>
        </span>
      `;
      btn.onclick = () => { applySwap(day, opt.source, opt.index); closeSwapMenu(); };
      list.appendChild(btn);
    });
  });
 
  menu.classList.add('open');
  // Scroll the menu back to top so the restore button / first group is visible
  const menuScroller = menu.querySelector('.swap-menu');
  if (menuScroller) menuScroller.scrollTop = 0;
}
 
function closeSwapMenu() {
  document.getElementById('swapMenu').classList.remove('open');
  activeSwapDay = null;
}
 
function applySwap(day, source, index) {
  const swaps = getSwaps();
  swaps[day] = { source, index };
  saveSwaps(swaps);
  rebuildCard(day);
}
 
function restoreOriginal(day) {
  const swaps = getSwaps();
  delete swaps[day];
  saveSwaps(swaps);
  rebuildCard(day);
}
 
// Close swap menu when clicking the dark overlay
document.getElementById('swapMenu').addEventListener('click', (e) => {
  if (e.target.id === 'swapMenu') closeSwapMenu();
});

  const tag = document.getElementById('recipeTag');
  const servings = document.getElementById('recipeServings');

  if (!recipe) {

    body.innerHTML = `<div class="recipe-missing">Recipe coming soon for this meal.</div>`;
  } else {
    tag.textContent = 'Recipe';
    servings.textContent = recipe.servings || '';
    const prepHTML = recipe.prep ? `<div class="recipe-prep-ahead"><strong>Make ahead:</strong> ${recipe.prep}</div>` : '';
    const ingredientsHTML = recipe.ingredients.map(i => `<li>${i}</li>`).join('');
    const stepsHTML = recipe.steps.map(s => `<li>${s}</li>`).join('');
    body.innerHTML = `
      ${prepHTML}

  ['Bakery & Bread', ['bun','bread','tortilla','roll','baguette','shell','rye','brioche','dough','muffin','croissant','pita','hoagie']],
  ['Pantry & Dry Goods', ['rice','pasta','fettuccine','angel hair','flour','sugar','olive oil','vegetable oil','vinegar','sauce','broth','stock','seasoning','spice','can ','beans','salsa','ketchup','mustard','relish','pickle','bbq','honey','soy','worcestershire','panko','breadcrumbs','stuffing','gravy','jam','pineapple','cornmeal','oregano','paprika','caper']],
  ['Frozen', ['frozen','fries']]
];
const GROCERY_CATEGORY_ORDER = ['Meat & Seafood','Dairy & Eggs','Produce','Bakery & Bread','Pantry & Dry Goods','Frozen','Other'];
const GROCERY_EXCLUDE = ['your phone','takeout menu','cash or card','call your favorite pizza place','order delivery'];
 
function categorizeIngredient(ing) {
  const low = ing.toLowerCase();
  for (const [cat, kws] of GROCERY_CATEGORY_KEYWORDS) {
    for (const kw of kws) {
      if (low.includes(kw)) return cat;
    }
  }
  return 'Other';
}
 
function weekOfDay(day) {
  if (day <= 7) return 1;
  if (day <= 14) return 2;
  if (day <= 21) return 3;
  if (day <= 28) return 4;
  return 5;
}
 
function getGroceryChecked() {
  try { return JSON.parse(localStorage.getItem(GROCERY_CHECKED_KEY)) || {}; }
  catch { return {}; }
}
 
function toggleGroceryItem(id) {
  const state = getGroceryChecked();
  state[id] = !state[id];
  try { localStorage.setItem(GROCERY_CHECKED_KEY, JSON.stringify(state)); } catch {}
  const el = document.querySelector(`.grocery-item[data-id="${id}"]`);
  if (el) el.classList.toggle('checked', !!state[id]);
}
 
// Builds the grocery list fresh from whatever meals are currently assigned
// (auto-shuffle + any manual swaps) — always live, never stale.
// Build categorized grocery data for every week (days 1-31), from whatever
// meals are currently assigned (shuffle + manual swaps). Shared by the
// on-screen list and the email export so they never drift out of sync.
function buildWeeksGroceryData() {
  const weeksData = { 1: [], 2: [], 3: [], 4: [], 5: [] };
  for (let day = 1; day <= 31; day++) {
    const meal = getMealForDay(day);
    weeksData[weekOfDay(day)].push({ day, meal });
  }
 
  const result = {};
  [1,2,3,4,5].forEach(wk => {
    const dayMeals = weeksData[wk];
    if (dayMeals.length === 0) return;
 
    const uniqueMealNames = [...new Set(dayMeals.map(dm => dm.meal.name))];
    const nonTakeout = dayMeals.filter(dm => dm.meal.name !== 'Takeout Night');
    const catItems = {};
 
    if (nonTakeout.length > 0) {
      dayMeals.forEach(dm => {
        if (dm.meal.name === 'Takeout Night') return;
        const recipe = recipes[dm.meal.name];
        if (!recipe) return;
        recipe.ingredients.forEach(ing => {
          const low = ing.toLowerCase();
          if (GROCERY_EXCLUDE.some(x => low.includes(x))) return;
          const cat = categorizeIngredient(ing);
          if (!catItems[cat]) catItems[cat] = [];
          catItems[cat].push({ ing, mealName: dm.meal.name });
        });
      });
    }
 
    result[wk] = {
      label: weekLabels[wk-1],
      mealNames: uniqueMealNames,
      hasTakeout: dayMeals.length !== nonTakeout.length,
      allTakeout: nonTakeout.length === 0,
      catItems
    };
  });
  return result;
}
 
// Build categorized grocery data for whichever breakfast/lunch items the
// person has checked "add to grocery list" on the Breakfast & Lunch tab.
function buildBfLunchGroceryData() {
  const selected = getBfLunchSelected();
  const allItems = [...breakfasts, ...lunches].filter(i => selected.includes(i.name));
  const catItems = {};
 
  allItems.forEach(item => {
    const recipe = recipes[item.name];
    if (!recipe) return;
    recipe.ingredients.forEach(ing => {
      const low = ing.toLowerCase();
      if (GROCERY_EXCLUDE.some(x => low.includes(x))) return;
      const cat = categorizeIngredient(ing);
      if (!catItems[cat]) catItems[cat] = [];
      catItems[cat].push({ ing, mealName: item.name });
    });
  });
 
  return {
    label: '🥣 Breakfast & Lunch Prep',
    mealNames: allItems.map(i => i.name),
    catItems,
    isEmpty: allItems.length === 0
  };
}

// Build a plain-text version of the grocery list for emailing.
// weekNum omitted = whole month; a number 1-5 = just that week.
function buildGroceryText(weekNum) {
  const weeksData = buildWeeksGroceryData();
  const weekKeys = weekNum && weekNum !== 'bflunch' ? [weekNum] : Object.keys(weeksData).map(Number);
  let lines = [];
 
  if (!weekNum) {
    lines.push(`MONTHLY MEAL PLAN — GROCERY LIST (${planMonthName})`);
    lines.push('');
  }
 
  if (!weekNum || weekNum !== 'bflunch') {
    weekKeys.forEach(wk => {
      const wd = weeksData[wk];
      if (!wd) return;
      lines.push(`${wd.label.toUpperCase()} — ${wd.mealNames.join(', ')}`);
      lines.push('');
 
      if (wd.allTakeout) {
        lines.push('No groceries needed — takeout night!');
      } else {
        GROCERY_CATEGORY_ORDER.forEach(cat => {
          if (!wd.catItems[cat]) return;
          lines.push(cat.toUpperCase());
          wd.catItems[cat].forEach(item => {
            lines.push(`- ${item.ing} (${item.mealName})`);
          });
          lines.push('');
        });
        if (wd.hasTakeout) {
          lines.push('Plus a Takeout Night this week — no shopping needed for that one.');
          lines.push('');
        }
      }
      lines.push('');
    });
  }
 
  if (!weekNum || weekNum === 'bflunch') {
    const bfLunchData = buildBfLunchGroceryData();
    lines.push(`${bfLunchData.label.toUpperCase()}${bfLunchData.mealNames.length ? ' — ' + bfLunchData.mealNames.join(', ') : ''}`);
    lines.push('');
    if (bfLunchData.isEmpty) {
      lines.push('Nothing selected yet — add items from the Breakfast & Lunch tab.');
    } else {
      GROCERY_CATEGORY_ORDER.forEach(cat => {
        if (!bfLunchData.catItems[cat]) return;
        lines.push(cat.toUpperCase());
        bfLunchData.catItems[cat].forEach(item => {
          lines.push(`- ${item.ing} (${item.mealName})`);
        });
        lines.push('');
      });
    }
    lines.push('');
  }
 
  return lines.join('\n').trim();
}
 
// Send the grocery list via the phone/browser's native share sheet
// (Mail, Messages, Notes, etc.) when available — this has no real length
// limit, unlike mailto: links, which cap out around ~2000 characters and
// silently fail to open once a list gets long.
// weekNum omitted = whole month; a number 1-5 = just that week; 'bflunch' = breakfast/lunch prep only.
async function emailGroceryList(weekNum) {
  const weeksData = buildWeeksGroceryData();
  const subject = weekNum === 'bflunch'
    ? `Grocery List — Breakfast & Lunch Prep (${planMonthName})`
    : weekNum
    ? `Grocery List — ${weeksData[weekNum] ? weeksData[weekNum].label : 'Week ' + weekNum} (${planMonthName})`
    : `Grocery List — ${planMonthName}`;
  const body = buildGroceryText(weekNum);
 
  if (navigator.share) {
    try {
      await navigator.share({ title: subject, text: body });
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return; // person cancelled the share sheet — do nothing
      // any other error: fall through to the mailto fallback below
    }
  }
 
  // Fallback for browsers without share support (mostly desktop).
  // mailto: links break above ~2000 chars in many clients, so trim hard.
  const MAX_BODY_CHARS = 1200;
  let finalBody = body;
  if (finalBody.length > MAX_BODY_CHARS) {
    finalBody = finalBody.slice(0, MAX_BODY_CHARS) + '\n\n…list truncated — open the app for the full version.';
  }
 
  const mailto = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(finalBody)}`;
  window.location.href = mailto;
}

const BFLUNCH_SELECTED_KEY = 'mealplan_bflunch_selected';
 
function getBfLunchSelected() {

  catch { return []; }

function saveBfLunchSelected(arr) {

function toggleBfLunchItem(name) {
  const selected = getBfLunchSelected();
  const idx = selected.indexOf(name);

function setAllBfLunchSelected(items, on) {
  let selected = getBfLunchSelected();

  } else {
    selected = selected.filter(n => !items.some(i => i.name === n));

  saveBfLunchSelected(selected);

  refreshGroceryIfVisible();
}

// ── View routing (Meal Plan <-> Grocery List <-> Breakfast & Lunch) ─────
function showView(view) {
  const planView = document.getElementById('planView');
  const groceryView = document.getElementById('groceryView');
  const bfLunchView = document.getElementById('bfLunchView');
  const tabs = document.querySelectorAll('.view-tab');
 
  planView.style.display = 'none';
  groceryView.style.display = 'none';
  bfLunchView.style.display = 'none';
 
  if (view === 'grocery') {
    groceryView.style.display = 'block';
    renderGroceryList();
  } else if (view === 'bflunch') {
    bfLunchView.style.display = 'block';
    renderBfLunchView();
  } else {
    view = 'plan';
    planView.style.display = '';
  }
 
  tabs.forEach(t => t.classList.toggle('active', t.dataset.view === view));
}
 
function handleHashRoute() {
  const hash = location.hash.replace('#', '');
  if (hash.startsWith('groceries')) {
    showView('grocery');
    const match = hash.match(/groceries-week-(\d|bflunch)/);
    if (match) {
      setTimeout(() => {
        const el = document.getElementById(`grocery-week-${match[1]}`);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 50);
    }
  } else if (hash.startsWith('breakfast-lunch')) {
    showView('bflunch');
  } else {
    showView('plan');
  }
}

// ── Supabase cross-device sync ──────────────────────────────────────────────
const SUPABASE_URL  = "https://sdkihobprbgbkrqgurqh.supabase.co";
const SUPABASE_KEY  = "sb_publishable_XHvk0yy9qfuVSfRhwPh-aA_zPNRULww";
const SYNC_TABLE    = "monthly_mealplan_data";
const SHARED_ROW_ID = "family_mealplan";
 
async function sbFetch(path, opts) {
  opts = opts || {};
  return fetch(SUPABASE_URL + "/rest/v1/" + path, {
    method: opts.method || "GET",
    headers: Object.assign({
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=minimal"
    }, opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
}
 
async function pushToCloud() {
  try {
    const payload = {
      id: SHARED_ROW_ID,
      checked: getChecked(),
      swaps: getSwaps(),
      shuffle: getShuffleState(),
      updated_at: new Date().toISOString()
    };
    // Try PATCH first; if row missing, INSERT
    const patch = await sbFetch(SYNC_TABLE + "?id=eq." + SHARED_ROW_ID, {
      method: "PATCH", prefer: "return=representation",
      headers: { "Accept": "application/json" }, body: payload
    });
    const patched = await patch.json();
    if (!patched || patched.length === 0) {
      await sbFetch(SYNC_TABLE, { method: "POST", prefer: "return=minimal", body: payload });
    }
  } catch (e) { console.warn("Sync push failed:", e); }
}
 
async function pullFromCloud() {
  try {
    const res = await sbFetch(SYNC_TABLE + "?id=eq." + SHARED_ROW_ID, {
      headers: { "Accept": "application/json" }
    });
    const rows = await res.json();
    if (!rows || rows.length === 0) {
      // No cloud row yet — publish what we have locally (including this
      // device's shuffle) so other devices can pick it up.
      pushToCloud();
      return;
    }
    const row = rows[0];
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(row.checked || [])); } catch(e) {}
    try { localStorage.setItem(SWAP_KEY, JSON.stringify(row.swaps || {})); } catch(e) {}
    if (row.shuffle && row.shuffle.month === currentMonth && row.shuffle.assignment) {
      // Cloud has a valid shuffle for this month — adopt it so both devices match
      saveShuffleState(row.shuffle);
    } else {
      // Cloud doesn't have this month's shuffle yet — publish ours up
      pushToCloud();
    }
    buildUI(currentFilter);
    updateProgress();
    refreshGroceryIfVisible();
  } catch (e) { console.warn("Sync pull failed:", e); }
}

// Pull fresh data from cloud on load

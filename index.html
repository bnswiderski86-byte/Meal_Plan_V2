<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Month Long Dinner Meal Plan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b333a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meal Plan">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef0f0;
    --paper: #fbfbfa;
    --ink: #2b333a;
    --muted: #6b7178;
    --accent: #3d7c78;
    --accent2: #4a6fa5;
    --accent3: #8c8368;
    --border: #d8d9d4;
    --tag-american: #e3f0ee;
    --tag-american-text: #2f6b66;
    --tag-mexican: #ece8dc;
    --tag-mexican-text: #7a6f4e;
    --tag-italian: #e7edf5;
    --tag-italian-text: #3a5a85;
    --tag-seafood: #e3eef2;
    --tag-seafood-text: #2b6e86;
    --tag-gout: #eceef0;
    --tag-gout-text: #4a555e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Karla', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 0 0 60px;
  }

  header {
    background: var(--ink);
    color: var(--bg);
    padding: 48px 32px 40px;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: rgba(61,124,120,0.14);
  }

  header::after {
    content: '';
    position: absolute;
    bottom: -40px; left: 10%;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(74,111,165,0.10);
  }

  .header-inner {
    max-width: 960px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .header-tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent3);
    margin-bottom: 10px;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    font-weight: 900;
    line-height: 1.05;
    margin-bottom: 14px;
  }

  header p {
    font-size: 15px;
    font-weight: 300;
    color: rgba(238,240,240,0.7);
    max-width: 540px;
    line-height: 1.6;
  }

  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 22px;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(238,240,240,0.75);
  }

  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot-american { background: var(--accent); }
  .dot-mexican  { background: var(--accent3); }
  .dot-italian  { background: var(--accent2); }
  .dot-seafood  { background: #1a6a9a; }

  .gout-note {
    margin-top: 18px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 12px;
    font-weight: 300;
    color: rgba(238,240,240,0.6);
    max-width: 580px;
    line-height: 1.65;
  }

  .gout-note strong { color: rgba(238,240,240,0.9); font-weight: 600; }

  .controls {
    max-width: 960px;
    margin: 28px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 7px 18px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--paper);
    font-family: 'Karla', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    color: var(--ink);
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .filter-btn[onclick*="'american'"] { background: var(--tag-american); color: var(--tag-american-text); border-color: var(--tag-american); }
  .filter-btn[onclick*="'american'"].active { background: var(--tag-american-text); color: #ffffff; border-color: var(--tag-american-text); }

  .filter-btn[onclick*="'mexican'"] { background: var(--tag-mexican); color: var(--tag-mexican-text); border-color: var(--tag-mexican); }
  .filter-btn[onclick*="'mexican'"].active { background: var(--tag-mexican-text); color: #ffffff; border-color: var(--tag-mexican-text); }

  .filter-btn[onclick*="'italian'"] { background: var(--tag-italian); color: var(--tag-italian-text); border-color: var(--tag-italian); }
  .filter-btn[onclick*="'italian'"].active { background: var(--tag-italian-text); color: #ffffff; border-color: var(--tag-italian-text); }

  .filter-btn[onclick*="'seafood'"] { background: var(--tag-seafood); color: var(--tag-seafood-text); border-color: var(--tag-seafood); }
  .filter-btn[onclick*="'seafood'"].active { background: var(--tag-seafood-text); color: #ffffff; border-color: var(--tag-seafood-text); }

  .weeks {
    max-width: 960px;
    margin: 32px auto 0;
    padding: 0 24px;
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .week-block {
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  .week-header {
    background: var(--ink);
    color: var(--bg);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .week-num {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 900;
    opacity: 0.2;
    line-height: 1;
    color: #ffffff;
  }

  .week-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #ffffff;
  }

  .week-sub {
    font-size: 13px;
    font-weight: 300;
    opacity: 0.55;
    color: #ffffff;
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }

  .day-card {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    transition: background 0.15s;
    display: flex;
    flex-direction: column;
  }

  .day-card:hover { background: #fdf0e4; }
  .day-card.hidden { display: none; }

  .day-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .day-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 10px;
  }

  .meal-name {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.3;
    margin-bottom: 7px;
  }

  .meal-desc {
    font-size: 12px;
    font-weight: 300;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 10px;
    flex: 1;
  }

  .gout-tip {
    font-size: 11px;
    font-weight: 400;
    color: var(--tag-gout-text);
    background: var(--tag-gout);
    border-radius: 6px;
    padding: 5px 8px;
    margin-bottom: 8px;
    line-height: 1.45;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: auto;
  }

  .cuisine-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 20px;
  }

  .tag-american { background: var(--tag-american); color: var(--tag-american-text); }
  .tag-mexican  { background: var(--tag-mexican);  color: var(--tag-mexican-text);  }
  .tag-italian  { background: var(--tag-italian);  color: var(--tag-italian-text);  }
  .tag-seafood  { background: var(--tag-seafood);  color: var(--tag-seafood-text);  }

  .guide-wrap {
    max-width: 960px;
    margin: 32px auto 0;
    padding: 0 24px;
  }

  .guide-inner {
    background: var(--paper);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 26px 28px;
  }

  .guide-inner h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    margin-bottom: 18px;
  }

  .guide-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  .guide-col h4 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .guide-col.good h4  { color: var(--accent2); }
  .guide-col.limit h4 { color: var(--accent3); }

  .guide-col ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .guide-col ul li {
    font-size: 13px;
    font-weight: 300;
    color: var(--muted);
    padding-left: 14px;
    position: relative;
    line-height: 1.45;
  }

  .guide-col ul li::before {
    content: '·';
    position: absolute;
    left: 0;
    font-weight: 900;
  }

  .guide-col.good ul li::before  { color: var(--accent2); }
  .guide-col.limit ul li::before { color: var(--accent3); }

  footer {
    max-width: 960px;
    margin: 36px auto 0;
    padding: 0 24px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.7;
  }

  @media (max-width: 540px) {
    header { padding: 36px 18px 32px; }
    .controls, .weeks, .guide-wrap { padding: 0 14px; }
    .days-grid { grid-template-columns: 1fr 1fr; }
    .guide-cols { grid-template-columns: 1fr; }
  }

  /* Checked / done state */
  .day-card.done {
    background: #f0f7f0;
    opacity: 0.75;
  }

  .day-card.done .meal-name {
    text-decoration: line-through;
    color: var(--muted);
  }

  .day-card.done .day-num {
    opacity: 0.4;
  }

  .check-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px 5px 8px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    font-family: 'Karla', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.18s;
  }

  .check-btn:hover {
    border-color: var(--accent2);
    color: var(--accent2);
    background: #f0f7f0;
  }

  .check-icon {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    background: white;
    flex-shrink: 0;
  }

  .day-card.done .check-btn {
    border-color: var(--accent2);
    color: var(--accent2);
    background: #e4f0e4;
  }

  .day-card.done .check-btn .check-icon {
    background: var(--accent2);
    border-color: var(--accent2);
    color: white;
  }

  /* Progress bar */
  .progress-wrap {
    max-width: 960px;
    margin: 20px auto 0;
    padding: 0 24px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
  }

  .progress-label strong { color: var(--accent2); font-size: 13px; }

  .progress-bar-outer {
    background: var(--border);
    border-radius: 20px;
    height: 8px;
    overflow: hidden;
  }

  .progress-bar-inner {
    height: 100%;
    background: var(--accent2);
    border-radius: 20px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .reset-btn {
    font-family: 'Karla', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: color 0.15s;
  }

  .reset-btn:hover { color: var(--accent); }

  /* Swap button & menu */
  .card-actions {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .swap-btn {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    font-family: 'Karla', sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.18s;
  }

  .swap-btn:hover {
    border-color: var(--accent3);
    color: var(--accent3);
    background: #fff8e6;
  }

  .day-card.swapped {
    border-right-color: var(--accent3);
    border-bottom-color: var(--accent3);
  }

  .tag-swap {
    background: #fff8e6;
    color: var(--accent3);
  }

  /* Swap menu overlay */
  .swap-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }

  .swap-overlay.open {
    display: flex;
  }

  .swap-menu {
    background: var(--paper);
    border-radius: 20px 20px 0 0;
    padding: 24px;
    width: 100%;
    max-width: 520px;
    max-height: 75vh;
    overflow-y: auto;
  }

  .swap-menu h4 {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    margin-bottom: 16px;
    color: var(--ink);
  }

  .swap-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 6px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Karla', sans-serif;
    text-align: left;
    transition: all 0.15s;
    gap: 10px;
  }

  .swap-option-tags {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .swap-group-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 16px 4px 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .swap-group-heading:first-child {
    margin-top: 4px;
  }

  .swap-group-count {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--accent3);
    background: var(--tag-mexican);
    padding: 2px 8px;
    border-radius: 20px;
  }

  .swap-option:hover {
    border-color: var(--accent3);
    background: #fff8e6;
  }

  .restore-option {
    border-color: var(--accent2);
    color: var(--accent2);
    margin-bottom: 12px;
  }

  .restore-option:hover {
    background: #f0f7f0;
  }

  .swap-option-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }

  .swap-close {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: var(--ink);
    color: var(--bg);
    font-family: 'Karla', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  /* Recipe modal */
  .meal-name {
    cursor: pointer;
    transition: color 0.15s;
  }

  .meal-name:hover {
    color: var(--accent);
  }

  .meal-name::after {
    content: ' →';
    opacity: 0;
    transition: opacity 0.15s;
    font-weight: 400;
  }

  .meal-name:hover::after {
    opacity: 0.5;
  }

  .recipe-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .recipe-overlay.open {
    display: flex;
  }

  .recipe-modal {
    background: var(--paper);
    border-radius: 16px;
    width: 100%;
    max-width: 640px;
    max-height: 88vh;
    overflow-y: auto;
    position: relative;
  }

  .recipe-header {
    background: var(--ink);
    color: var(--bg);
    padding: 28px 32px 22px;
    border-radius: 16px 16px 0 0;
    position: sticky;
    top: 0;
    z-index: 2;
  }

  .recipe-tag {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent3);
    margin-bottom: 6px;
  }

  .recipe-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 8px;
  }

  .recipe-servings {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.7;
  }

  .recipe-close-x {
    position: absolute;
    top: 18px;
    right: 18px;
    background: rgba(255,255,255,0.1);
    border: none;
    color: var(--bg);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    transition: background 0.15s;
  }

  .recipe-close-x:hover {
    background: rgba(255,255,255,0.25);
  }

  .recipe-body {
    padding: 24px 32px 28px;
  }

  .recipe-section h5 {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1.5px solid var(--border);
  }

  .recipe-section.steps h5 {
    color: var(--accent);
    margin-top: 24px;
  }

  .recipe-ingredients {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .recipe-ingredients li {
    font-size: 13.5px;
    font-weight: 300;
    color: var(--ink);
    line-height: 1.55;
    padding-left: 18px;
    position: relative;
  }

  .recipe-ingredients li::before {
    content: '○';
    position: absolute;
    left: 0;
    color: var(--accent2);
    font-weight: 700;
  }

  .recipe-steps {
    list-style: none;
    counter-reset: step-counter;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .recipe-steps li {
    font-size: 14px;
    font-weight: 300;
    color: var(--ink);
    line-height: 1.6;
    padding-left: 38px;
    position: relative;
    counter-increment: step-counter;
  }

  .recipe-steps li::before {
    content: counter(step-counter);
    position: absolute;
    left: 0;
    top: 0;
    width: 26px;
    height: 26px;
    background: var(--accent);
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    font-family: 'Karla', sans-serif;
  }

  .recipe-missing {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 300;
  }

  @media (max-width: 540px) {
    .recipe-overlay { padding: 0; align-items: flex-end; }
    .recipe-modal { max-height: 92vh; border-radius: 16px 16px 0 0; }
    .recipe-header { padding: 24px 22px 18px; }
    .recipe-body { padding: 20px 22px 24px; }
    .recipe-title { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
  </div>
</header>

<div class="controls">
  <button class="filter-btn active" onclick="filterMeals('all', this)">All Meals</button>
  <button class="filter-btn" onclick="filterMeals('american', this)">American</button>
  <button class="filter-btn" onclick="filterMeals('mexican', this)">Mexican</button>
  <button class="filter-btn" onclick="filterMeals('italian', this)">Italian</button>
  <button class="filter-btn" onclick="filterMeals('seafood', this)">Seafood</button>
</div>

<div class="progress-wrap">
  <div class="progress-label">
    <span>Meals completed — <strong id="monthLabel"></strong></span>
    <div style="display:flex;align-items:center;gap:12px;">
      <strong id="progressText">0 of 31</strong>
      <button class="reset-btn" onclick="resetAll()">↺ Reset</button>
    </div>
  </div>

  { name:"Smothered Chicken Thighs", cuisine:"american", seafood:false,
    desc:"Pan-seared chicken thighs in a creamy onion and mushroom gravy, served over mashed potatoes.",
    gout:"Chicken thighs and mushrooms are both gout-friendly. One of the best swaps on the list." },

  { name:"Honey Mustard Chicken Thighs", cuisine:"american", seafood:false,
    desc:"Oven-baked chicken thighs glazed with honey mustard, served with roasted potatoes and green beans.",
    gout:"Chicken and honey mustard are both gout-neutral. Easy weeknight swap." },

  { name:"Pizza Night", cuisine:"american", seafood:false,
    desc:"Homemade or order out — your call. Load it up however the family wants it.",
    gout:"Watch sodium on delivery pizza. Homemade lets you control the toppings and portions." },

  { name:"Takeout Night", cuisine:"american", seafood:false,
    desc:"Your choice — pick up whatever sounds good tonight.",
    gout:"Watch sodium and portion sizes. Avoid organ meat dishes and high-purine soups." },
];

const weekLabels = ["Week One", "Week Two", "Week Three", "Week Four", "Week Five"];
const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// Anchor Day 1 to first day of current month
const today = new Date();
const planStartDate = new Date(today.getFullYear(), today.getMonth(), 1);
const planMonthName = planStartDate.toLocaleString('default', { month: 'long', year: 'numeric' });

// Storage keys
const STORAGE_KEY = 'mealplan_checked';
const SWAP_KEY = 'mealplan_swaps';
const MONTH_KEY = 'mealplan_month';

// Auto-reset checkmarks AND swaps when the month changes
const currentMonth = `${today.getFullYear()}-${today.getMonth()}`;
const savedMonth = localStorage.getItem(MONTH_KEY);
if (savedMonth !== currentMonth) {
  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(SWAP_KEY);
  localStorage.setItem(MONTH_KEY, currentMonth);
}

let currentFilter = 'all';

function getDayName(dayNum) {
  const date = new Date(planStartDate);
  date.setDate(dayNum);
  return dayNames[date.getDay()];
}

// Checkmark storage
function getChecked() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}

function saveChecked(arr) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch {}
}

// Swap storage
function getSwaps() {
  try { return JSON.parse(localStorage.getItem(SWAP_KEY)) || {}; }
  catch { return {}; }
}

function saveSwaps(obj) {
  try { localStorage.setItem(SWAP_KEY, JSON.stringify(obj)); } catch {}
}

// Get the meal currently shown for a given day (original or swapped)
// Swap storage format: { source: 'pool'|'menu', index: N }
// Legacy format (just a number) is treated as 'pool' for backward compat
function getMealForDay(day) {
  const swaps = getSwaps();
  const swap = swaps[day];
  if (swap !== undefined) {
    // Legacy format: bare number means swapPool index
    if (typeof swap === 'number') {
      return { ...swapPool[swap], day, _swapped: true };
    }
    // New format: { source, index }
    if (swap.source === 'menu') {
      const menuMeal = meals[swap.index];
      return { ...menuMeal, day, _swapped: true };
    }
    return { ...swapPool[swap.index], day, _swapped: true };
  }
  const original = meals.find(m => m.day === day);
  return { ...original, _swapped: false };
}

// Check if a meal matches the current filter
function matchesFilter(meal, filter) {
  if (filter === 'all') return true;
  if (filter === 'seafood') return meal.seafood;
  return meal.cuisine === filter;
}

// Build a single card's HTML content (used by both initial render and rebuild)
function buildCardHTML(meal, day) {
  const checked = getChecked();
  const isChecked = checked.includes(day);

  let tagsHTML = '';
  if (meal.seafood) tagsHTML += `<span class="cuisine-tag tag-seafood">Seafood</span>`;
  tagsHTML += `<span class="cuisine-tag tag-${meal.cuisine}">${meal.cuisine.charAt(0).toUpperCase()+meal.cuisine.slice(1)}</span>`;
  if (meal._swapped) tagsHTML += `<span class="cuisine-tag tag-swap">Swapped</span>`;

  const goutHTML = meal.gout ? `<div class="gout-tip">💧 ${meal.gout}</div>` : '';

  return `
    <div class="day-label">${getDayName(day)} · Day ${day}</div>
    <div class="day-num">${day}</div>
    <div class="meal-name" onclick="openRecipe('${meal.name.replace(/'/g, "\\'")}')">${meal.name}</div>
    <div class="meal-desc">${meal.desc}</div>
    ${goutHTML}
    <div class="tags">${tagsHTML}</div>
    <div class="card-actions">
      <button class="check-btn" onclick="toggleDay(${day})">
        <span class="check-icon">${isChecked ? '✓' : ''}</span>
        <span class="check-label">${isChecked ? 'Done!' : 'Mark as made'}</span>
      </button>
      <button class="swap-btn" onclick="openSwapMenu(${day})">⇄ Swap</button>
    </div>
  `;
}

// Apply correct CSS classes to a card based on its state
function applyCardState(card, meal, day) {
  const isChecked = getChecked().includes(day);
  card.className = 'day-card' +
    (isChecked ? ' done' : '') +
    (meal._swapped ? ' swapped' : '') +
    (matchesFilter(meal, currentFilter) ? '' : ' hidden');
}

// Build the entire weeks grid
function buildUI(filter) {
  currentFilter = filter;
  const container = document.getElementById('weeksContainer');
  container.innerHTML = '';

  const weeks = [[], [], [], [], []];
  meals.forEach(m => {
    const wi = m.day <= 7 ? 0 : m.day <= 14 ? 1 : m.day <= 21 ? 2 : m.day <= 28 ? 3 : 4;
    weeks[wi].push(m);
  });

  weeks.forEach((week, wi) => {
    // Count visible meals using the actual displayed meal (which may be swapped)
    const visibleCount = week.filter(m => matchesFilter(getMealForDay(m.day), filter)).length;

    if (visibleCount === 0) return;

    const block = document.createElement('div');
    block.className = 'week-block';
    block.innerHTML = `
      <div class="week-header">
        <div class="week-num">0${wi+1}</div>
        <div>
          <div class="week-title">${weekLabels[wi]}</div>
        </div>
      </div>
    `;

    const grid = document.createElement('div');
    grid.className = 'days-grid';

    week.forEach(originalMeal => {
      const meal = getMealForDay(originalMeal.day);
      const card = document.createElement('div');
      card.dataset.day = originalMeal.day;
      applyCardState(card, meal, originalMeal.day);
      card.innerHTML = buildCardHTML(meal, originalMeal.day);
      grid.appendChild(card);
    });

    block.appendChild(grid);
    container.appendChild(block);
  });
}

// Rebuild a single card in place (after swap or restore)
function rebuildCard(day) {
  const card = document.querySelector(`.day-card[data-day="${day}"]`);
  if (!card) return;
  const meal = getMealForDay(day);
  applyCardState(card, meal, day);
  card.innerHTML = buildCardHTML(meal, day);

  // Recalculate week count in case filter visibility changed
  refreshWeekCounts();
}

// Update the "X dinners" subtitle on each week header to reflect filter + swaps
function refreshWeekCounts() {
  const blocks = document.querySelectorAll('.week-block');
  const weeks = [[], [], [], [], []];
  meals.forEach(m => {
    const wi = m.day <= 7 ? 0 : m.day <= 14 ? 1 : m.day <= 21 ? 2 : m.day <= 28 ? 3 : 4;
    weeks[wi].push(m);
  });

  let blockIndex = 0;
  weeks.forEach((week) => {
    const visibleCount = week.filter(m => matchesFilter(getMealForDay(m.day), currentFilter)).length;
    if (visibleCount === 0) return;
    const block = blocks[blockIndex];
    if (block) {
      const sub = block.querySelector('.week-sub');
      if (sub) sub.textContent = `${visibleCount} dinner${visibleCount !== 1 ? 's' : ''}`;
    }
    blockIndex++;
  });
}

function filterMeals(type, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  buildUI(type);
}

// Checkmark toggling
function toggleDay(day) {
  let checked = getChecked();
  checked = checked.includes(day)
    ? checked.filter(d => d !== day)
    : [...checked, day];
  saveChecked(checked);

  const card = document.querySelector(`.day-card[data-day="${day}"]`);
  if (card) {
    const meal = getMealForDay(day);
    applyCardState(card, meal, day);
    const icon = card.querySelector('.check-icon');
    const label = card.querySelector('.check-label');
    const isDone = checked.includes(day);
    if (icon) icon.textContent = isDone ? '✓' : '';
    if (label) label.textContent = isDone ? 'Done!' : 'Mark as made';
  }
  updateProgress();
}

function updateProgress() {
  const count = getChecked().length;
  document.getElementById('progressText').textContent = `${count} of 31`;
  document.getElementById('progressBar').style.width = (count / 31 * 100) + '%';
}

function resetAll() {
  if (!confirm('Clear all checkmarks and start fresh?')) return;
  saveChecked([]);
  document.querySelectorAll('.day-card.done').forEach(card => {
    const day = parseInt(card.dataset.day, 10);
    const meal = getMealForDay(day);
    applyCardState(card, meal, day);
    const icon = card.querySelector('.check-icon');
    const label = card.querySelector('.check-label');
    if (icon) icon.textContent = '';
    if (label) label.textContent = 'Mark as made';
  });
  updateProgress();
}

// Swap menu
let activeSwapDay = null;

function openSwapMenu(day) {
  activeSwapDay = day;
  const menu = document.getElementById('swapMenu');
  const list = document.getElementById('swapList');
  list.innerHTML = '';

  const swaps = getSwaps();
  if (swaps[day] !== undefined) {
    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'swap-option restore-option';
    restoreBtn.innerHTML = `<span class="swap-option-name">↩ Restore Original Meal</span>`;
    restoreBtn.onclick = () => { restoreOriginal(day); closeSwapMenu(); };
    list.appendChild(restoreBtn);
  }

  // Build unified option list: main menu meals + swap pool
  // Tag each with its source so we know where to pull from on apply
  const allOptions = [];
  meals.forEach((meal, i) => {
    // Skip the current day's own original meal from the swap list
    if (meal.day !== day) {
      allOptions.push({ meal, source: 'menu', index: i });
    }
  });
  swapPool.forEach((meal, i) => {
    allOptions.push({ meal, source: 'pool', index: i });
  });

  // Group by cuisine
  const groups = {
    american: { label: 'American', items: [] },
    mexican: { label: 'Mexican', items: [] },
    italian: { label: 'Italian', items: [] },
  };
  allOptions.forEach(opt => {
    const cuisine = opt.meal.cuisine;
    if (groups[cuisine]) groups[cuisine].items.push(opt);
  });

  // Sort each group alphabetically and dedupe by name (so a meal doesn't
  // show up twice if it's in both meals[] and swapPool)
  Object.values(groups).forEach(g => {
    const seen = new Set();
    g.items = g.items
      .filter(opt => {
        if (seen.has(opt.meal.name)) return false;
        seen.add(opt.meal.name);
        return true;
      })
      .sort((a, b) => a.meal.name.localeCompare(b.meal.name));
  });

  // Render each cuisine group
  ['american', 'mexican', 'italian'].forEach(cuisine => {
    const group = groups[cuisine];
    if (group.items.length === 0) return;

    const heading = document.createElement('div');
    heading.className = 'swap-group-heading';
    heading.innerHTML = `<span>${group.label}</span><span class="swap-group-count">${group.items.length}</span>`;
    list.appendChild(heading);

    group.items.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'swap-option';
      const tagColor = `tag-${opt.meal.cuisine}`;
      const seafoodTag = opt.meal.seafood
        ? `<span class="cuisine-tag tag-seafood">Seafood</span>`
        : '';
      btn.innerHTML = `
        <span class="swap-option-name">${opt.meal.name}</span>
        <span class="swap-option-tags">
          ${seafoodTag}
          <span class="cuisine-tag ${tagColor}">${opt.meal.cuisine.charAt(0).toUpperCase()+opt.meal.cuisine.slice(1)}</span>
        </span>
      `;
      btn.onclick = () => { applySwap(day, opt.source, opt.index); closeSwapMenu(); };
      list.appendChild(btn);
    });
  });

  menu.classList.add('open');
  // Scroll the menu back to top so the restore button / first group is visible
  const menuScroller = menu.querySelector('.swap-menu');
  if (menuScroller) menuScroller.scrollTop = 0;
}

function closeSwapMenu() {
  document.getElementById('swapMenu').classList.remove('open');
  activeSwapDay = null;
}

function applySwap(day, source, index) {
  const swaps = getSwaps();
  swaps[day] = { source, index };
  saveSwaps(swaps);
  rebuildCard(day);
}

function restoreOriginal(day) {
  const swaps = getSwaps();
  delete swaps[day];
  saveSwaps(swaps);
  rebuildCard(day);
}

// Close swap menu when clicking the dark overlay
document.getElementById('swapMenu').addEventListener('click', (e) => {
  if (e.target.id === 'swapMenu') closeSwapMenu();
});

// Recipe modal
function openRecipe(mealName) {
  const recipe = recipes[mealName];
  const modal = document.getElementById('recipeModal');
  const title = document.getElementById('recipeTitle');
  const tag = document.getElementById('recipeTag');
  const servings = document.getElementById('recipeServings');
  const body = document.getElementById('recipeBody');

  title.textContent = mealName;

  if (!recipe) {
    tag.textContent = 'Recipe';
    servings.textContent = '';
    body.innerHTML = `<div class="recipe-missing">Recipe coming soon for this meal.</div>`;
  } else {
    tag.textContent = 'Recipe';
    servings.textContent = recipe.servings || '';
    const ingredientsHTML = recipe.ingredients.map(i => `<li>${i}</li>`).join('');
    const stepsHTML = recipe.steps.map(s => `<li>${s}</li>`).join('');
    body.innerHTML = `
      <div class="recipe-section ingredients">
        <h5>Ingredients</h5>
        <ul class="recipe-ingredients">${ingredientsHTML}</ul>
      </div>
      <div class="recipe-section steps">
        <h5>Instructions</h5>
        <ol class="recipe-steps">${stepsHTML}</ol>
      </div>
    `;
  }

  modal.classList.add('open');
  modal.scrollTop = 0;
}

function closeRecipe() {
  document.getElementById('recipeModal').classList.remove('open');
}

document.getElementById('recipeModal').addEventListener('click', (e) => {
  if (e.target.id === 'recipeModal') closeRecipe();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeRecipe();
    closeSwapMenu();
  }
});

// Initialize
document.getElementById('monthLabel').textContent = planMonthName;
buildUI('all');
updateProgress();

// ── Supabase cross-device sync ──────────────────────────────────────────────
const SUPABASE_URL  = "https://sdkihobprbgbkrqgurqh.supabase.co";
const SUPABASE_KEY  = "sb_publishable_XHvk0yy9qfuVSfRhwPh-aA_zPNRULww";
const SYNC_TABLE    = "mealplan_data";
const SHARED_ROW_ID = "family_mealplan";

async function sbFetch(path, opts) {
  opts = opts || {};
  return fetch(SUPABASE_URL + "/rest/v1/" + path, {
    method: opts.method || "GET",
    headers: Object.assign({
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      "Prefer": opts.prefer || "return=minimal"
    }, opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
}

async function pushToCloud() {
  try {
    const payload = {
      id: SHARED_ROW_ID,
      checked: getChecked(),
      swaps: getSwaps(),
      updated_at: new Date().toISOString()
    };
    // Try PATCH first; if row missing, INSERT
    const patch = await sbFetch(SYNC_TABLE + "?id=eq." + SHARED_ROW_ID, {
      method: "PATCH", prefer: "return=representation",
      headers: { "Accept": "application/json" }, body: payload
    });
    const patched = await patch.json();
    if (!patched || patched.length === 0) {
      await sbFetch(SYNC_TABLE, { method: "POST", prefer: "return=minimal", body: payload });
    }
  } catch (e) { console.warn("Sync push failed:", e); }
}

async function pullFromCloud() {
  try {
    const res = await sbFetch(SYNC_TABLE + "?id=eq." + SHARED_ROW_ID, {
      headers: { "Accept": "application/json" }
    });
    const rows = await res.json();
    if (!rows || rows.length === 0) return;
    const row = rows[0];
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(row.checked || [])); } catch(e) {}
    try { localStorage.setItem(SWAP_KEY, JSON.stringify(row.swaps || {})); } catch(e) {}
    buildUI(currentFilter);
    updateProgress();
  } catch (e) { console.warn("Sync pull failed:", e); }
}

// Override save functions to also push after every local save
const _origSaveChecked = window.saveChecked || saveChecked;
window.saveChecked = function(arr) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); } catch(e) {}
  pushToCloud();
};

const _origSaveSwaps = window.saveSwaps || saveSwaps;
window.saveSwaps = function(obj) {
  try { localStorage.setItem(SWAP_KEY, JSON.stringify(obj)); } catch(e) {}
  pushToCloud();
};

// Pull fresh data from cloud on load
pullFromCloud();

// ── Service Worker (enables PWA install to home screen) ────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(function() {});
}
